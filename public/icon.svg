<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e0533"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <g filter="url(#glowStrong)">
    <circle cx="256" cy="210" r="72" fill="none" stroke="#06ffcb" stroke-width="10"/>
    <circle cx="256" cy="210" r="72" fill="none" stroke="#a855f7" stroke-width="6" opacity="0.6"/>
    <circle cx="256" cy="210" r="16" fill="#06ffcb"/>
  </g>
  <g filter="url(#glow)">
