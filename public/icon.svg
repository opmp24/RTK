    <path d="M196 370 L256 270 L316 370" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="256" cy="460" r="6" fill="#06ffcb" opacity="0.4"/>
    <circle cx="120" cy="100" r="4" fill="#a855f7" opacity="0.3"/>
    <circle cx="400" cy="140" r="3" fill="#06ffcb" opacity="0.3"/>
    <circle cx="80" cy="350" r="2.5" fill="#fbbf24" opacity="0.2"/>
